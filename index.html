<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Future 2025 — Приглашение</title>
  <style>
    /* Стиль Apple: белый фон, серые акценты, плавность */
    :root {
      --bg-color: #f5f5f7;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --border-color: #d2d2d7;
      --accent: #0071e3;
      --accent-hover: #0077ed;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.4;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 24px; /* Большие скругления как у Apple */
      padding: 50px 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.04);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
    }

    .intro {
      text-align: center;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: var(--text-main); /* Черная кнопка как на apple.com */
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #333336;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .message.success {
      color: #34c759; /* Apple Green */
      opacity: 1;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Digital Future</h1>
      <p class="subtitle">Приглашение на конференцию</p>
    </header>

    <p class="intro">
      15 марта 2025 года. Москва.<br>
      Заполните форму, чтобы забронировать место.
    </p>

    <form id="regForm">
      <div class="form-group">
        <label>Имя и фамилия</label>
        <input type="text" id="name" placeholder="Иван Иванов" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Секция</label>
        <select id="topic" required>
          <option value="" disabled selected>Выберите направление</option>
          <option value="web">Веб-разработка</option>
          <option value="ai">Искусственный интеллект</option>
          <option value="security">Кибербезопасность</option>
        </select>
      </div>

      <div class="form-group">
        <label>Комментарий (необязательно)</label>
        <textarea id="comment" placeholder="Ваши вопросы..."></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="agree" required>
        <label for="agree">Согласен на обработку данных</label>
      </div>

      <button type="submit">Отправить заявку</button>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Останавливаем перезагрузку страницы
      
      const name = document.getElementById('name').value;
      const msg = document.getElementById('message');
      
      // Показываем сообщение об успехе
      msg.textContent = `Спасибо, ${name}! Ваша заявка принята.`;
      msg.className = 'message success';
      
      // Очищаем форму
      this.reset();
    });
  </script>
</body>
</html>
